name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ./Part2_RaceDay_API.sln

    - name: Build
      run: dotnet build ./Part2_RaceDay_API.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test ./Part2_RaceDay_API.sln --no-build --configuration Release --verbosity normal
